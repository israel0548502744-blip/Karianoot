name: Build Karianoot APK

# Builds the small app. The AI models are NOT inside the APK: the app downloads them itself,
# and they stay on the phone across updates.
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the Qwen engine for the phone (qwentts.cpp + JNI, arm64)
        run: |
          # Ubuntu's package mirror is sometimes unreachable from the runner: prefer the PyPI build of ninja.
          command -v ninja > /dev/null || pipx install ninja > /dev/null || sudo apt-get install -y -q ninja-build > /dev/null
          ninja --version
          android/qwen/build_android.sh "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
      - name: Build the Magpie engine for the phone (magpie-tts.cpp + Hebrew patch + JNI, arm64)
        run: android/magpie/build_android.sh "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
      - name: Build APK
        run: |
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Karianoot.apk
          ls -la Karianoot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Karianoot-apk
          path: Karianoot.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: |
          printf 'להתקנה: להוריד את Karianoot.apk לטלפון ולפתוח (לאשר התקנה ממקורות לא ידועים).\nהמודלים יורדים מתוך האפליקציה, פעם אחת.\nBuilt from %s @ %s.\n' "${{ github.ref_name }}" "${{ github.sha }}" > notes.txt
          gh release create "$TAG" Karianoot.apk --target "${{ github.sha }}" --title "קריינות - גרסה ${{ github.run_number }}" \
            --notes-file notes.txt --latest
