name: Host model files

# EVERY model file the app downloads is kept in this repo's permanent release "models-v1" (never deleted by any workflow),
# with the license and readme of its source repo, so the app never depends on a creator keeping a repo online:
#  - Blue V3: the Hugging Face repo notmax123/BlueV3-onnx answers 404 since Nov 2026 (release check); the files come
#    from our mirror (models-mirror/bluev3.tgz, fetched on Nov 8 at the pinned revision) and are checked by size.
#  - Magpie q8_0: copied from the magpie-gguf prerelease (which magpie-cpp.yml deletes and remakes) and checked by sha256.
# Prints each file's sha256 for Catalog.kt.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/host-models.yml"]

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Blue V3 from the mirror
        run: |
          mkdir -p up
          curl -sSL "https://github.com/$GITHUB_REPOSITORY/releases/download/models-mirror/bluev3.tgz" | tar xz
          python3 - <<'PY'
          import os, re, shutil
          src = open("android/app/src/main/java/com/karianoot/app/Catalog.kt", encoding="utf-8").read()
          body = src[src.index("val blueV3 = ModelInfo("):src.index("val blue25 = ModelInfo(")]
          for path, size in re.findall(r'ModelFile\("([^"]+)", ([\d_]+)', body):
              f = os.path.join("blue_v3", path); n = os.path.getsize(f)
              assert n == int(size.replace("_", "")), (path, n, size)
              shutil.copy(f, os.path.join("up", "bluev3-" + path.replace("/", "-")))
              print("ok", path, n)
          PY
      - name: Magpie q8_0
        run: |
          gh release download magpie-gguf -R "$GITHUB_REPOSITORY" -p magpie-he-q8_0.gguf -D up
          echo "5d1f2cffa97c6fbc83a53da2bf965d00cb7c4691feedc4dd0960a5e566ac51c4  up/magpie-he-q8_0.gguf" | sha256sum -c
          curl -sSL -o up/NOTICE-magpie.txt "https://github.com/$GITHUB_REPOSITORY/releases/download/magpie-gguf/NOTICE.txt" || true
      - name: Every other model file, from Hugging Face at its pinned revision (+ the repo's license and readme)
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          src = open("android/app/src/main/java/com/karianoot/app/Catalog.kt", encoding="utf-8").read()
          blocks = re.split(r"\n    val \w+ = ModelInfo\(", src)[1:]
          for body in blocks:
              mid = re.search(r'\bid = "([^"]+)"', body).group(1)
              repo = (re.search(r'\brepo = "([^"]+)"', body) or [None, ""])[1]
              rev = (re.search(r'\brevision = "([^"]+)"', body) or [None, ""])[1]
              repos = {(repo, rev)}
              for m in re.finditer(r'ModelFile\(([^()]*)\)', body):
                  args = m.group(1)
                  if "url =" in args: continue
                  path = re.match(r'\s*"([^"]+)"', args).group(1)
                  size = int(re.search(r",\s*([\d_]+)", args).group(1).replace("_", ""))
                  r_ = (re.search(r'repo = "([^"]+)"', args) or [None, repo])[1]
                  v_ = (re.search(r'revision = "([^"]+)"', args) or [None, rev])[1]
                  repos.add((r_, v_))
                  out = f"up/{mid}-{path.replace('/', '-')}"
                  urllib.request.urlretrieve(f"https://huggingface.co/{r_}/resolve/{v_}/{path}", out)
                  assert os.path.getsize(out) == size, (out, os.path.getsize(out), size)
                  print("ok", out, size, flush=True)
              for r_, v_ in sorted(repos):
                  if not r_: continue
                  for doc in ("LICENSE", "LICENSE.md", "LICENSE.txt", "README.md"):
                      try:
                          urllib.request.urlretrieve(f"https://huggingface.co/{r_}/resolve/{v_}/{doc}",
                                                     f"up/license-{r_.replace('/', '_')}-{doc}")
                          print("doc", r_, doc)
                      except Exception:
                          pass
          PY
      - name: License texts (NVIDIA Open Model License for Magpie, and the Magpie Hebrew model card)
        run: |
          curl -sSL -A "Mozilla/5.0" -o up/license-nvidia-open-model-license.html \
            "https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-license/" || true
          python3 - <<'PY'
          import html, re
          try:
              t = open("up/license-nvidia-open-model-license.html", encoding="utf-8", errors="replace").read()
              t = re.sub(r"(?s)<(script|style).*?</\1>", " ", t); t = html.unescape(re.sub(r"<[^>]+>", "\n", t))
              t = "\n".join(l.strip() for l in t.splitlines() if l.strip())
              open("up/license-nvidia-open-model-license.txt", "w").write(t)
              print(len(t), "chars")
          except Exception as e:
              print("no license page", e)
          PY
          curl -sSL -o up/license-notmax123_magpie_tts_multilingual_357m-he-README.md \
            "https://huggingface.co/notmax123/magpie_tts_multilingual_357m-he/resolve/d0c5e96fdc167e3f2286e9ce5813b3c795f0b53a/README.md" || true
          curl -sSL -o up/license-nvidia_magpie_tts_multilingual_357m-README.md \
            "https://huggingface.co/nvidia/magpie_tts_multilingual_357m/resolve/main/README.md" || true
          ls -la up/license-* 
      - name: Blue 2.5 int8 graphs (dtsj89/puki-syrinx, MIT), ready if the user picks them (picker r16)
        run: |
          R=4e9ec197665804435bac30452a9e52e101405886
          for f in vector_estimator.onnx vocoder.onnx LICENSE-BlueTTS README.md; do
            curl -sSL -o "up/blue_25_int8-$f" "https://huggingface.co/dtsj89/puki-syrinx/resolve/$R/$f"; done
          ls -la up/blue_25_int8-*; sha256sum up/blue_25_int8-*.onnx
      - name: Magpie notice in the exact words the NVIDIA Open Model License asks for
        run: |
          printf '%s\n\n%s\n' "Licensed by NVIDIA Corporation under the NVIDIA Open Model License" \
            "magpie-he-q8_0.gguf: notmax123/magpie_tts_multilingual_357m-he (fine-tune of nvidia/magpie_tts_multilingual_357m) and nvidia/nemo-nano-codec-22khz-1.89kbps-21.5fps, converted for magpie-tts.cpp. Agreement: license-nvidia-open-model-license.txt in this release." > up/magpie-NOTICE.txt
      - name: Upload (adds missing files only; never deletes or replaces)
        run: |
          gh release view models-v1 -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create models-v1 -R "$GITHUB_REPOSITORY" --prerelease --title "Model files for the app (permanent)" \
              --notes "Model files the app downloads. Do not delete: installed apps point here. Blue V3: MIT (BlueTTS, notmax123). Magpie: NVIDIA Open Model License (see NOTICE-magpie.txt)."
          # Never replace a file that is already there: replacing deletes it first, and installs in progress would get 404.
          have=$(gh release view models-v1 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for f in up/*; do
            if echo "$have" | grep -qxF "$(basename "$f")"; then echo "kept $(basename "$f")"; else gh release upload models-v1 "$f" -R "$GITHUB_REPOSITORY"; fi
          done
          cd up && sha256sum * && ls -l
