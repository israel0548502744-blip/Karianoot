name: Script writer probe

# Can a small open model (commercial licence) write a good Hebrew tips-video script on the phone? llama.cpp on a 4-core
# runner, a few prompts from structured match data, timing per model. Output: prerelease "llm-probe" (report.md).
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/llm-probe.yml", "tools/llm/**"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: llama.cpp (the project's own Linux build, b11669)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/ggml-org/llama.cpp/releases/tags/b11669 -q '.assets[] | select(.name | test("ubuntu-x64")) | select(.name | test("vulkan|cuda|rocm|sycl|openvino") | not) | .browser_download_url' | head -1)
          echo "asset: $URL"; curl -sSfL -o llama.pkg "$URL"
          sha256sum llama.pkg | tee llama_version.txt; echo "$URL" >> llama_version.txt
          mkdir -p lc && (unzip -q llama.pkg -d lc 2>/dev/null || tar xf llama.pkg -C lc)
          S=$(find lc -name llama-server -type f | head -1); echo "SERVER=$S" >> $GITHUB_ENV; ls -la "$S"
          "$S" --version 2>&1 | head -3 | tee -a llama_version.txt
      - name: Candidate models (licence check first)
        run: |
          pip install -q huggingface_hub
          python3 tools/llm/pick_models.py | tee models.txt
      - name: Write scripts
        run: LD_LIBRARY_PATH=$(dirname $SERVER) python3 tools/llm/probe.py $SERVER models.txt out
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out || exit 0
          cp models.txt llama_version.txt out/ || true
          gh release delete llm-probe -y -R "$GITHUB_REPOSITORY" --cleanup-tag 2>/dev/null || true
          gh release create llm-probe out/* -R "$GITHUB_REPOSITORY" --prerelease --title "Script writer probe" --notes "Hebrew scripts from small models. Not the app." || true
