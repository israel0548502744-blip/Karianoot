name: Magpie Hebrew probe

# notmax123/magpie_tts_multilingual_357m-he (NVIDIA Open Model License: commercial use allowed): 357M parameters
# (about 5x smaller than Qwen), 15 Hebrew voices, IPA input from RenikudPlus. Renders the test passage in every
# Hebrew voice on CPU and measures speed; ASR scoring is done offline from the release.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/magpie-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: NeMo (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone -q --depth 1 https://github.com/maxmelichov/magpie_tts_multilingual_357m-he m
          cd m && git log -1 --format=%H && git clone -q --depth 1 https://github.com/NVIDIA/NeMo.git && (cd NeMo && git log -1 --format=%H)
          pip install -q -e "./NeMo[tts]" 2>&1 | tail -3
          pip install -q "huggingface_hub[cli]" peft onnxruntime soundfile "renikud-plus @ git+https://github.com/maxmelichov/RenikudPlus"
          mkdir -p venv/bin && ln -sf "$(which python)" venv/bin/python
      - name: Model and text
        run: |
          hf download notmax123/magpie_tts_multilingual_357m-he --revision d0c5e96fdc167e3f2286e9ce5813b3c795f0b53a --local-dir ckpt
          hf download notmax123/RenikudPlus model_int8.onnx --revision 679c56ca449d41873fb8ff7711ddf7563d28198f --local-dir renikud
          ls -la ckpt ckpt/assets | head -30
          cat ckpt/speaker_index.json || true
          mkdir -p ctx && python -c "import numpy as np, soundfile as sf; sf.write('ctx/ctx.wav', (np.random.default_rng(0).standard_normal(22050 * 11) * 0.02).astype('float32'), 22050)"
          python - <<'PY'
          import json, re
          from renikud_onnx import G2P
          g = G2P("renikud/model_int8.onnx")
          TEXT = ("ערב טוב לכל האוהדים! הערב יש לנו משחק ענק בין ריאל מדריד לברצלונה. "
                  "תסתכלו על היחס, והיחס פה פשוט מטורף. אני ממליץ לשים על ניצחון של ריאל, ושני שערים לפחות. "
                  "מי שעוד לא הצטרף לקבוצה, זה הזמן. בהצלחה לכולם, ונתראה במשחק הבא!")
          out, cur = [], ""
          for s in re.findall(r"[^.!?]+[.!?]", TEXT):
              s = s.strip()
              if cur and len(cur) + len(s) + 1 > 130: out.append(cur); cur = s
              else: cur = (cur + " " + s).strip()
          if cur: out.append(cur)
          rows = []
          for spk in range(5, 20):
              for i, piece in enumerate(out):
                  ipa = g.phonemize(piece).replace("hajˈaχas", "hajjˈaχas").replace("baʁtslˈona", "baʁtselˈona")
                  rows.append({"audio_filepath": "ctx.wav", "text": ipa, "duration": 11.0, "context_audio_filepath": "ctx.wav",
                               "context_text": ipa, "context_audio_duration": 11.0, "speaker_index": spk})
          with open("ctx/manifest.json", "w") as f:
              for r in rows: f.write(json.dumps(r, ensure_ascii=False) + "\n")
          json.dump({"pieces": out, "speakers": list(range(5, 20))}, open("ctx/plan.json", "w"), ensure_ascii=False)
          print(len(rows), "rows;", out)
          PY
      - name: CPU shim
        run: |
          # NeMo's Magpie inference moves everything to CUDA; on a CPU runner, map those calls to the CPU.
          mkdir -p shim && cat > shim/sitecustomize.py <<'PY'
          import torch
          def _cpu(d):
              return "cpu" if (isinstance(d, str) and d.startswith("cuda")) or (isinstance(d, torch.device) and d.type == "cuda") else d
          def _fixkw(k):
              if "device" in k: k["device"] = _cpu(k["device"])
              return k
          for _n in ["zeros", "ones", "tensor", "arange", "full", "empty", "randn", "rand", "randint", "linspace",
                     "zeros_like", "ones_like", "full_like", "empty_like", "as_tensor", "eye"]:
              _f = getattr(torch, _n)
              setattr(torch, _n, (lambda f: lambda *a, **k: f(*a, **_fixkw(k)))(_f))
          torch.Tensor.cuda = lambda self, *a, **k: self
          torch.nn.Module.cuda = lambda self, *a, **k: self
          _tto, _mto = torch.Tensor.to, torch.nn.Module.to
          torch.Tensor.to = lambda self, *a, **k: _tto(self, *[_cpu(x) for x in a], **_fixkw(k))
          torch.nn.Module.to = lambda self, *a, **k: _mto(self, *[_cpu(x) for x in a], **_fixkw(k))
          torch.cuda.is_available = lambda: False
          torch.set_num_threads(4)
          PY
      - name: Generate
        run: |
          cd m
          start=$(date +%s)
          PYTHONPATH=$GITHUB_WORKSPACE/shim python scripts/infer_hebrew.py --checkpoint ../ckpt/magpie_hebrew.ckpt --hparams ../ckpt/hparams.yaml \
            --manifest ../ctx/manifest.json --audio-dir ../ctx --out-dir ../out --gpu "" 2>&1 | tail -60
          echo "SECONDS $(( $(date +%s) - start ))"
          find ../out -name "*.wav" | head -5; find ../out -name "*.wav" | wc -l
      - name: Pack
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os, soundfile as sf
          wavs = sorted(glob.glob("out/**/*.wav", recursive=True))
          tot = sum(sf.info(w).duration for w in wavs)
          print("WAVS", len(wavs), "audio seconds", round(tot, 1))
          json.dump({"wavs": wavs, "audio_seconds": tot}, open("ctx/result.json", "w"))
          PY
          tar czf magpie.tgz out ctx || true
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f magpie.tgz ] || exit 0
          gh release delete magpie-probe -y -R "$GITHUB_REPOSITORY" --cleanup-tag 2>/dev/null || true
          gh release create magpie-probe magpie.tgz -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Magpie Hebrew probe" --notes "notmax123/magpie_tts_multilingual_357m-he samples (NVIDIA Open Model License). Not the app."
