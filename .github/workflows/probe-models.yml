name: Probe model repositories

# Lists the files, sizes and licenses of the Hugging Face repositories the app can use,
# so the model catalog is written from real data (this sandbox cannot reach Hugging Face).
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-models.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q huggingface_hub
      - name: List repositories
        run: |
          python - <<'PY' | tee probe.txt
          from huggingface_hub import HfApi
          api = HfApi()
          repos = [
              "notmax123/QwenTTS-he-1.7B-GGUF", "notmax123/magpie_tts_multilingual_357m-he", "notmax123/Fish-Audio-S2-Pro-He",
              "notmax123/bluev2-onnx-int8", "notmax123/robo_shaul", "notmax123/blue-v2", "Qwen/Qwen3-TTS-12Hz-0.6B-Base",
              "nvidia/magpie_tts_multilingual_357m", "Serveurperso/Qwen3-TTS-GGUF",
          ]
          for r in repos:
              try:
                  info = api.model_info(r, files_metadata=True)
              except Exception as e:
                  print(f"## {r}: ERROR {e}\n"); continue
              lic = (info.card_data or {}).get("license") if info.card_data else None
              print(f"## {r}  license={lic}  sha={info.sha}")
              for s in info.siblings:
                  print(f"  {s.size or 0:>12}  {s.rfilename}")
              print()
          PY
      - name: Search for Hebrew Piper and Orpheus repos
        run: |
          python - <<'PY' | tee -a probe.txt
          from huggingface_hub import HfApi
          api = HfApi()
          for q in ["qwen3-tts gguf", "qwentts", "magpie hebrew"]:
              print(f"## search: {q}")
              for m in api.list_models(search=q, limit=40):
                  print("  ", m.id)
              print()
          PY
      - name: Print model cards
        run: |
          python - <<'PY' | tee -a probe.txt
          from huggingface_hub import hf_hub_download
          for repo, f in [("notmax123/QwenTTS-he-1.7B-GGUF", "README.md"), ("notmax123/magpie_tts_multilingual_357m-he", "README.md"),
                          ("notmax123/Fish-Audio-S2-Pro-He", "README.md"), ("notmax123/robo_shaul", "README.md"),
                          ("nvidia/magpie_tts_multilingual_357m", "README.md")]:
              try:
                  print(f"===== {repo}/{f}\n" + open(hf_hub_download(repo, f)).read())
              except Exception as e:
                  print(f"===== {repo}/{f}: {e}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
