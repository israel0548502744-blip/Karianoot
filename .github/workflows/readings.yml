name: How it will be read

# "איך זה ייקרא" (Readings + IpaHebrew) on the proofreader's sentences with the real G2P: how many sentences pair word
# by word, and a few readings in Hebrew with niqqud to look at.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/readings.yml", "android/engine/src/main/kotlin/com/karianoot/engine/Readings.kt",
            "android/engine/src/main/kotlin/com/karianoot/engine/IpaHebrew.kt", "android/engine/src/test/kotlin/com/karianoot/engine/ReadingsTest.kt"]

jobs:
  readings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Readings of every proofreader sentence
        run: |
          mkdir -p proof/renikud && cp tools/proof/sentences.txt proof/
          curl -sSL -o proof/renikud/model_int8.onnx https://github.com/$GITHUB_REPOSITORY/releases/download/models-v1/g2p-model_int8.onnx
          KARIANOOT_PROOF=$PWD/proof gradle -p android :engine:test --tests 'com.karianoot.engine.ReadingsTest' --no-daemon -i 2>&1 | tee test.log | grep -E "CHECK|FAILED" || true
          grep -q "CHECK readings paired" test.log && ! grep -q "ReadingsTest > .* FAILED" test.log
