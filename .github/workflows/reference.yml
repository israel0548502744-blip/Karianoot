name: Engine reference and tests

# 1. Runs the original Python packages on fixed sentences and saves their output ("golden").
# 2. Runs the app's Kotlin engine on the same sentences (JVM) and checks it matches.
on:
  workflow_dispatch:
  push:
    paths: ["android/engine/**", "tools/reference.py", ".github/workflows/reference.yml"]

env:
  BLUE_V3_REV: b26faaa63255d2991998c7f28c10aa4e6026f3c9
  BLUE_25_REV: 95feb5d0cbfc8e5a95bffb067d03537cbf35be3e
  RENIKUD_REV: 679c56ca449d41873fb8ff7711ddf7563d28198f

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ env.BLUE_V3_REV }}-${{ env.BLUE_25_REV }}-${{ env.RENIKUD_REV }}
      - name: Download models
        run: |
          pip install -q "huggingface_hub[cli]"
          [ -d models/blue_v3 ] || hf download notmax123/BlueV3-onnx --revision $BLUE_V3_REV --local-dir models/blue_v3 --exclude "*.md" ".gitattributes"
          [ -d models/blue_25 ] || hf download notmax123/BlueTTS2.5-onnx --revision $BLUE_25_REV --local-dir models/blue_25 --exclude "*.md" ".gitattributes"
          [ -f models/renikud/model_int8.onnx ] || hf download notmax123/RenikudPlus model_int8.onnx --revision $RENIKUD_REV --local-dir models/renikud
          rm -rf models/*/.cache
          du -sh models/*
      - name: Install the original packages
        run: |
          pip install -q onnxruntime soundfile "renikud-plus[cpu]" "blue-onnx @ git+https://github.com/maxmelichov/BlueTTS"
          pip show blue-onnx renikud-plus | grep -E "Name|Version"
      - name: Build golden data
        run: python tools/reference.py models golden
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: golden

  kotlin:
    needs: golden
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache models
        uses: actions/cache/restore@v4
        with:
          path: models
          key: models-${{ env.BLUE_V3_REV }}-${{ env.BLUE_25_REV }}-${{ env.RENIKUD_REV }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: golden
          path: golden
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Engine tests against the golden data
        env:
          KARIANOOT_MODELS: ${{ github.workspace }}/models
          KARIANOOT_GOLDEN: ${{ github.workspace }}/golden
        run: |
          [ -f android/engine/build.gradle.kts ] || { echo "no engine yet"; exit 0; }
          set -o pipefail
          gradle -p android :engine:test --no-daemon -i 2>&1 | grep -E "CHECK|FAIL|PASS|Tests|BUILD|Exception|expected|at com.karianoot" | head -300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-output
          path: |
            android/engine/build/test-out
            android/engine/build/reports/tests
