name: Video maker on Android

# VideoMakerTest (app/src/androidTest) on an Android 14 emulator: makes two short videos with captions (plain background,
# pictures) and checks tracks, length and that the caption is drawn. Frames: prerelease "video-test".
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/video-test.yml", "android/app/src/main/java/com/karianoot/app/VideoMaker.kt",
            "android/app/src/androidTest/**", "android/engine/src/main/kotlin/com/karianoot/engine/Captions.kt"]

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the app and its on-device tests
        run: gradle -p android :app:assemblePersonalDebug :app:assemblePersonalDebugAndroidTest --no-daemon -q
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r -g android/app/build/outputs/apk/personal/debug/app-personal-debug.apk
            adb install -r -g android/app/build/outputs/apk/androidTest/personal/debug/app-personal-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.karianoot.app.VideoMakerTest com.karianoot.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb logcat -d | grep -E "CHECK|VideoMaker|AndroidRuntime|MediaCodec.*rror" | tail -80 > logcat.txt || true
            mkdir -p out && adb pull /sdcard/Android/data/com.karianoot.app/files/videotest out/ || true
            grep -q "OK (2 tests)" instrument.txt
      - name: Show the results
        if: always()
        run: cat instrument.txt logcat.txt 2>/dev/null | tail -120; ls -la out/videotest 2>/dev/null || true
      - name: Publish frames (prerelease video-test)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/videotest || exit 0
          cp instrument.txt logcat.txt out/ 2>/dev/null || true
          tar czf video-test.tgz out
          gh release delete video-test -y -R "$GITHUB_REPOSITORY" --cleanup-tag 2>/dev/null || true
          gh release create video-test video-test.tgz -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Video maker test" --notes "Frames of test videos made on an emulator. Not the app." || true
