name: VoxCPM2 Hebrew probe

# openbmb/VoxCPM2 (Apache-2.0, 2B, 30 languages; Hebrew listed by third parties): is its Hebrew usable?
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/voxcpm-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q voxcpm huggingface_hub soundfile
      - name: Model card and languages
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi, hf_hub_download
          i = HfApi().model_info("openbmb/VoxCPM2", files_metadata=True)
          print("license", (i.card_data or {}).get("license"), "sha", i.sha, "size", sum((s.size or 0) for s in i.siblings))
          t = open(hf_hub_download("openbmb/VoxCPM2", "README.md")).read()
          import re
          for line in t.splitlines():
              if re.search(r"Hebrew|language|Languages", line): print("CARD", line[:300])
          PY
      - name: Generate
        run: |
          mkdir -p out
          python - <<'PY'
          import time, inspect, numpy as np, soundfile as sf
          from voxcpm import VoxCPM
          m = VoxCPM.from_pretrained("openbmb/VoxCPM2", load_denoiser=False) if "load_denoiser" in inspect.signature(VoxCPM.from_pretrained).parameters else VoxCPM.from_pretrained("openbmb/VoxCPM2")
          print("generate signature:", inspect.signature(m.generate))
          S = ["ערב טוב לכל האוהדים! הערב יש לנו משחק ענק בין ריאל מדריד לברצלונה.",
               "תסתכלו על היחס, והיחס פה פשוט מטורף. אני ממליץ לשים על ניצחון של ריאל, ושני שערים לפחות.",
               "מי שעוד לא הצטרף לקבוצה, זה הזמן. בהצלחה לכולם, ונתראה במשחק הבא!"]
          parts, sr = [], getattr(m, "sample_rate", None) or getattr(getattr(m, "tts_model", None), "sample_rate", 48000)
          t0 = time.time()
          for s in S:
              w = m.generate(text=s)
              parts += [np.asarray(w, np.float32).reshape(-1), np.zeros(int(sr * 0.18), np.float32)]
              print("GEN", f"{time.time() - t0:.0f}s", flush=True)
          sf.write("out/voxcpm2.wav", np.concatenate(parts[:-1]), sr)
          print("DONE", sr, f"{time.time() - t0:.0f}s")
          PY
          cd out && tar czf ../voxcpm.tgz . && cd ..
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f voxcpm.tgz ] || exit 0
          gh release delete voxcpm-samples -y -R "$GITHUB_REPOSITORY" --cleanup-tag 2>/dev/null || true
          gh release create voxcpm-samples voxcpm.tgz -R "$GITHUB_REPOSITORY" --prerelease \
            --title "VoxCPM2 Hebrew probe (for tools)" --notes "VoxCPM2 (Apache-2.0) Hebrew sample. Not the app."
